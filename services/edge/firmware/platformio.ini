; SinchaiSlot Edge firmware for ESP32 (RS-485 Modbus RTU to the Altivar Solar drive, MQTT uplink)
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    4-20ma/ModbusMaster@^2.0.1
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0.4
build_flags =
    -DSINCHAI_PUMP_ID=\"P1\"
    -DRS485_DE_PIN=4
