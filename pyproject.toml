[project]
name = "sinchaislot"
version = "0.1.0"
description = "Planning, verification and access layer for shared solar irrigation pumps"
requires-python = ">=3.12,<3.13"
readme = "README.md"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "redis>=5.0",
  "httpx>=0.27",
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=16",
  "scipy>=1.13",
  "scikit-learn>=1.5",
  "lightgbm>=4.3",
  "pvlib>=0.11",
  "highspy>=1.7",
  "pymodbus>=3.6",
  "paho-mqtt>=2.1",
  "amqtt>=0.11; python_version<'3.13'",
  "mcp>=1.2",
  "matplotlib>=3.9",
  "reportlab>=4.2",
  "pyyaml>=6.0",
  "orjson>=3.10",
  "anthropic>=0.40",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "hypothesis>=6.112",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
  "packages/schemas/sinchai_schemas",
  "services/api/sinchai_api",
  "services/planner/sinchai_planner",
  "services/jalprahari/sinchai_jal",
  "services/rasid/sinchai_rasid",
  "services/channels/sinchai_channels",
  "services/speech/sinchai_speech",
  "services/edge/sinchai_edge",
  "services/devices/sinchai_devices",
  "services/sim/sinchai_sim",
  "services/data/sinchai_data",
]

[project.scripts]
sinchaislot-mcp = "sinchai_api.mcp_server:main"

[tool.pytest.ini_options]
testpaths = ["tests", "evals"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q -p no:warnings"
markers = ["slow: long-running tests", "network: needs internet"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = false
