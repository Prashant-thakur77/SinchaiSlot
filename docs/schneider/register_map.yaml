device: Schneider Electric Altivar Solar ATV320 (ATV320 platform)
addressing:
  register_type: holding registers (function 3 read, 6/16 write, 23 read/write)
  pdu_address: 'logical address used directly as the Modbus PDU register address (no 40001 offset, no -1). Example in NVE41308
    p.19: W3102 is requested as 0x0C1E.'
  byte_order: 'big endian: high-order byte first within each 16-bit word (NVE41308 p.18)'
  word_size: 16 bit; all registers listed are single 16-bit words
  signed_types: INT (Signed16) values are two's complement
registers:
- name: Control word (CiA402 / Drivecom)
  mnemonic: CMD
  address: 8501
  address_hex: '0x2135'
  access: RW
  type: WORD (BitString16)
  unit: null
  scale: null
  description: Control word. Bit0 switch on, bit1 enable voltage, bit2 quick stop (0 = active), bit3 enable operation, bit7
    fault reset on 0->1 edge, bit8 halt, bit11 direction (0 forward, 1 reverse; default assignment of [Reverse Assign] rrS),
    bits 11-15 assignable.
  group: control
  source:
  - NVE41316 V3.5 (ATV320 communication parameters), sheet Parameters, row 3
  - NVE41308 (ATV320 Modbus Serial Link Manual, 04/2016), p.46 (bit map and command values)
  - NVE41308 (ATV320 Modbus Serial Link Manual, 04/2016), p.48 (bit 11 default = reverse)
  - NVE41316 V3.5, sheet Registers, rows 26-50
  verified: true
- name: Frequency reference
  mnemonic: LFR
  address: 8502
  address_hex: '0x2136'
  access: RW
  type: INT (Signed16)
  unit: Hz
  scale: 0.1
  description: Signed frequency setpoint, range -599.0 .. 599.0 Hz.
  group: control
  source:
  - NVE41316 V3.5 (ATV320 communication parameters), sheet Parameters, row 6
  - NVE41295.06 (ATV320 Programming Manual), p.46 and p.49
  verified: true
- name: Speed setpoint
  mnemonic: LFRD
  address: 8602
  address_hex: '0x219A'
  access: RW
  type: INT (Signed16)
  unit: rpm
  scale: 1
  description: Signed speed setpoint in rpm, range -32767 .. 32767 rpm. Default second word of the communication scanner output
    (NCA2 = 8602).
  group: control
  source:
  - NVE41316 V3.5 (ATV320 communication parameters), sheet Parameters, row 5
  - NVE41308 (ATV320 Modbus Serial Link Manual, 04/2016), p.63
  verified: true
- name: Extended control word
  mnemonic: CMI
  address: 8504
  address_hex: '0x2138'
  access: RW
  type: WORD (BitString16)
  unit: null
  scale: null
  description: Bit0 factory setting command, bit1 save configuration to EEPROM (only when stopped).
  group: control
  source:
  - NVE41316 V3.5 (ATV320 communication parameters), sheet Parameters, row 2
  - NVE41316 V3.5, sheet Registers, rows 1-25
  verified: true
- name: Status word (CiA402 / Drivecom)
  mnemonic: ETA
  address: 3201
  address_hex: '0x0C81'
  access: R
  type: WORD (BitString16)
  unit: null
  scale: null
  description: Status word. Bit0 ready to switch on, bit1 switched on, bit2 operation enabled, bit3 fault, bit4 voltage enabled,
    bit5 quick stop (0 = active), bit6 switch on disabled, bit7 warning, bit9 remote, bit10 target reached, bit11 internal
    limit active, bit14 stop via STOP key, bit15 direction (1 = reverse). State = ETA & 0x006F.
  group: status
  source:
  - NVE41316 V3.5 (ATV320 communication parameters), sheet Parameters, row 10
  - NVE41308 (ATV320 Modbus Serial Link Manual, 04/2016), p.49
  - NVE41316 V3.5, sheet Registers, rows 52-86
  verified: true
- name: Drivecom status word (alternate address)
  mnemonic: ETAD
  address: 8603
  address_hex: '0x219B'
  access: R
  type: WORD (BitString16)
  unit: null
  scale: null
  description: DRIVECOM status word at the 86xx address block.
  group: status
  source:
  - NVE41316 V3.5 (ATV320 communication parameters), sheet Parameters, row 724
  - NVE41316 V3.5, sheet Registers, rows 62-86
  verified: true
- name: Extended state register
  mnemonic: ETI
  address: 3206
  address_hex: '0x0C86'
  access: R
  type: WORD (BitString16)
  unit: null
  scale: null
  description: Bit0 EEPROM access, bit2 fault no longer active (not reset), bit4 speed mode, bit5 DC injection, bit6 transient
    state, bit7 motor thermal threshold, bit8 DC bus overvoltage, bit9 accelerating, bit10 decelerating, bit11 current limit,
    bit12 fast stop, bits13-14 command source (0/0 terminal, 1/0 remote keypad, 0/1 Modbus, 1/1 CANopen or network card),
    bit15 reverse before ramp.
  group: status
  source:
  - NVE41316 V3.5 (ATV320 communication parameters), sheet Parameters, row 12
  - NVE41316 V3.5, sheet Registers, rows 87-108
  verified: true
- name: Drive state
  mnemonic: HMIS
  address: 3240
  address_hex: '0x0CA8'
  access: R
  type: WORD (Enumeration)
  unit: null
  scale: null
  description: 'Enumerated drive state: 0 TUN, 1 DCB, 2 RDY, 3 NST, 4 RUN, 5 ACC, 6 DEC, 7 CLI, 8 FST, 9 FLU, 11 NLP (no mains
    voltage), 12 PRA, 13 CTL, 14 OBR, 15 SOC, 17 USA, 18 TC, 19 ST, 20 FA, 21 OK, 22 EP, 23 FLT (in fault), 25 DCP, 28 SS1,
    29 SLS, 30 STO.'
  group: status
  source:
  - NVE41316 V3.5 (ATV320 communication parameters), sheet Parameters, row 11
  - NVE41316 V3.5, sheet Enumerations, rows 265-292
  verified: true
  note: The solar firmware adds a [Low Light] LL state (PKR47019.03 p.122); its numeric HMIS value is not listed in NVE41316
    V3.5. UNVERIFIED for LL.
