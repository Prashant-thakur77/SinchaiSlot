- mnemonic: OBF
  name: DC Bus Overvoltage
  description: DC bus overvoltage error
  lft_value: 18
  lft_source: NVE41316 V3.5, sheet Enumerations, row 327
  causes:
  - Braking too sudden or driving load.
  - Supply voltage too high.
  remedies:
  - Increase the deceleration time.
  - Install a braking resistor if necessary.
  - Activate the [Dec.Ramp Adapt] BRA function, if it is compatible with the application.
  - Check the supply voltage.
  clearing: This detected error can be cleared with the [Auto Fault Reset] ATR or manually with the [Fault Reset Assign] rsf
