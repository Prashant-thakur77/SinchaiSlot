- mnemonic: OPF2
  name: Output Phase Loss
  description: Output phase loss error
  lft_value: 33
  lft_source: NVE41316 V3.5, sheet Enumerations, row 341
  causes:
  - Motor not connected or motor power too low.
  - Output contactor open.
  - Instantaneous instability in the motor current.
  remedies:
  - Check the connections from the drive to the motor.
  - If an output contactor is being used, set [Output phase loss] OPL to [No Error Triggered] OAC.
  - 'Test on a low power motor or without a motor: In factory settings mode, motor phase loss detection is active [Output
    phase loss] OPL = [Yes] YES. To check the drive in a test or maintenance environment, without having to use a motor with
    the same rating as the drive (in particular for high power drives), deactivate motor phase loss detection [Output phase
    loss] OPL = [No] NO.'
  - 'Check and optimize the following parameters: [IR compensation] UFR , [Nom Motor Voltage] UNS and [Nom Motor Current]
    NCR and perform [Autotuning] TUN .'
  clearing: This detected error can be cleared with the [Auto Fault Reset] ATR or manually with the [Fault Reset Assign] rsf
    parameter after its cause has been removed.
  source:
  - PKR47019.03 (Altivar Solar ATV320 User Manual, 11/2024), p.173
  - NVE41295.06 (ATV320 Programming Manual), p.414
  verified: true
