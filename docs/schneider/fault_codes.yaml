- mnemonic: EEF1
  name: EEprom Control
  description: EEprom control error
  lft_value: 2
  lft_source: NVE41316 V3.5, sheet Enumerations, row 314
  causes:
  - Internal memory detected error, control block.
  remedies:
  - Check the environment (electromagnetic compatibility).
  - Turn off, reset, return to factory settings
  - Contact Schneider Electric Product Support.
  clearing: This detected error requires a power reset of the device after its cause has been removed.
  source:
  - PKR47019.03 (Altivar Solar ATV320 User Manual, 11/2024), p.165
  - NVE41295.06 (ATV320 Programming Manual), p.407
  verified: true
- mnemonic: CFF
  name: Incorrect Config
  description: Incorrect configuration error
  lft_value: 3
  lft_source: NVE41316 V3.5, sheet Enumerations, row 315
  causes:
  - Option module changed or removed.
  - Control block replaced by a control block configured on a drive with a different rating.
  - The current configuration is inconsistent.
  remedies:
  - Check that there are no detected module errors.
  - In the event of the option module being changed/removed deliberately, see the remarks below.
  - Return to factory settings or retrieve the backup configuration, if it is valid.
  clearing: This detected error is cleared as soon as its cause has been removed.
  source:
  - PKR47019.03 (Altivar Solar ATV320 User Manual, 11/2024), p.163
  - NVE41295.06 (ATV320 Programming Manual), p.405
  verified: true
- mnemonic: CFI
  name: Invalid Configuration
  description: Invalid configuration error
  lft_value: 4
  lft_source: NVE41316 V3.5, sheet Enumerations, row 316
  causes:
  - Invalid configuration. The configuration loaded in the drive via the bus or communication network is inconsistent.
  remedies:
  - Check the configuration loaded previously.
  - Load a compatible configuration.
  clearing: This detected error is cleared as soon as its cause has been removed.
  source:
  - PKR47019.03 (Altivar Solar ATV320 User Manual, 11/2024), p.163
  - NVE41295.06 (ATV320 Programming Manual), p.405
  verified: true
