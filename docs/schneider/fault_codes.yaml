- mnemonic: SPF
  name: Encoder Feedback Loss
  description: Encoder feedback loss error
  lft_value: 11
  lft_source: NVE41316 V3.5, sheet Enumerations, row 323
  causes:
  - Signal on Pulse input missing, if the input is used for speed measurement.
  - Encoder feedback signal missing.
  remedies:
  - Check the wiring of the input cable and the detector used.
  - Check the configuration parameters of the encoder.
  - Check the wiring between the encoder and the drive.
  - Check the encoder.
  clearing: This detected error can be cleared with the [Auto Fault Reset] ATR or manually with the [Fault Reset Assign] rsf
    parameter after its cause has been removed.
