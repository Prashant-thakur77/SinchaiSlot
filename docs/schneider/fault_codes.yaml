- mnemonic: ANF
  name: Load slipping
  description: Load slipping error
  lft_value: 12
  lft_source: NVE41316 V3.5, sheet Enumerations, row 324
  causes:
  - The difference between the output frequency and the speed feedback is not correct.
  remedies:
  - Check the motor, gain and stability parameters.
  - Add a braking resistor.
  - Check the size of the motor/drive/load.
  - Check the encoder's mechanical coupling and its wiring.
  - Check the setting of parameters.
  clearing: This detected error requires a power reset of the device after its cause has been removed.
  source:
