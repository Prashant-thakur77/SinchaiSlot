- mnemonic: OCF
  name: Overcurrent
  description: Overcurrent error
  lft_value: 9
  lft_source: NVE41316 V3.5, sheet Enumerations, row 321
  causes:
  - Parameters in the [Settings] SET- and [Motor control] DRC- menus are not correct.
  - Inertia or load too high.
  - Mechanical locking.
  remedies:
  - Check the parameters.
  - Check the size of the motor/drive/load.
  - Check the state of the mechanism.
  - Decrease [Current Limitation] CLI.
  - Increase the switching frequency.
  clearing: '● If the parameter [Extended Fault Reset] HrfC is set to [No] NO : This detected error requires a power reset.
    ● If the parameter [Extended Fault Reset] HrfC is set to [Yes] YES : This detected error can be cleared manually with
