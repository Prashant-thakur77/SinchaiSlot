- mnemonic: SCF1
  name: Motor short circuit
  description: Motor short circuit error
  lft_value: 23
  lft_source: NVE41316 V3.5, sheet Enumerations, row 332
  causes:
  - Short-circuit or grounding at the drive output.
  remedies:
  - Check the cables connecting the drive to the motor, and the motor insulation.
  - Reduce the switching frequency.
  - Connect chokes in series with the motor.
  - Check the adjustment of speed loop and brake.
  - Increase the [Time to restart] TTR .
  - Increase the switching frequency.
  clearing: '● If the parameter [Extended Fault Reset] HrfC is set to [No] NO : This detected error requires a power reset.
    ● If the parameter [Extended Fault Reset] HrfC is set to [Yes] YES : This detected error can be cleared manually with
    the [Fault Reset Assign] rsf parameter after its cause has been removed.'
  source:
  - PKR47019.03 (Altivar Solar ATV320 User Manual, 11/2024), p.175
  - NVE41295.06 (ATV320 Programming Manual), p.416
  verified: true
- mnemonic: SOF
  name: Motor Overspeed
  description: Motor overspeed error
  lft_value: 24
  lft_source: NVE41316 V3.5, sheet Enumerations, row 333
  causes:
  - Instability or driving load too high.
  - If a downstream contactor is used, the contacts between the motor and the drive have not been closed before applying a
    Run command.
  - The overspeed threshold (corresponding to 110 % of [Max Frequency] TFR) has been reached.
  remedies:
  - Check the motor, gain and stability parameters.
  - Add a braking resistor.
  - Check the size of the motor/drive/load.
  - Check the parameters settings for the [Frequency meter] FQF- function, if it is configured.
  - Verify and close the contacts between the motor and the drive before applying a Run command.
  - Verify the consistency between [Max Frequency] TFR and [High Speed] HSP. It is recommended to have at least [Max Frequency]
    TFR ≥ 110% * [High Speed] HSP.
  clearing: This detected error can be cleared with the [Auto Fault Reset] ATR or manually with the [Fault Reset Assign] rsf
    parameter after its cause has been removed.
  source:
  - PKR47019.03 (Altivar Solar ATV320 User Manual, 11/2024), p.177
  - NVE41295.06 (ATV320 Programming Manual), p.418
  verified: true
- mnemonic: TNF
  name: Autotuning Error
  description: Autotuning detected error
  lft_value: 25
  lft_source: NVE41316 V3.5, sheet Enumerations, row 334
  causes:
  - Special motor or motor whose power is not suitable for the drive.
  - Motor not connected to the drive.
  - Motor not stopped
  remedies:
  - Check that the motor/drive are compatible.
  - Check that the motor is present during auto-tuning.
  - If an output contactor is being used, close it during auto-tuning.
  - Check that the motor is stopped during tune operation.
  clearing: This detected error can be cleared with the [Auto Fault Reset] ATR or manually with the [Fault Reset Assign] rsf
    parameter after its cause has been removed.
  source:
  - PKR47019.03 (Altivar Solar ATV320 User Manual, 11/2024), p.178
  - NVE41295.06 (ATV320 Programming Manual), p.419
  verified: true
