- mnemonic: PHF
  name: Input Phase Loss
  description: Input phase loss error
  lft_value: 21
  lft_source: NVE41316 V3.5, sheet Enumerations, row 330
  causes:
  - Drive incorrectly supplied or a fuse blown.
  - One phase missing.
  - 3-phase ATV320 used on a single-phase supply mains.
  - Unbalanced load. This protection only operates with the drive on load.
  remedies:
  - Check the power connection and the fuses. Use a 3-phase supply mains. Disable the detected error by [InPhaseLoss Assign]
    IPL = [No] NO.
  clearing: This detected error is cleared as soon as its cause has been removed.
  source:
