# Hosted backend: the Python services behind Caddy (automatic HTTPS). The web app is deployed separately and
# forwards /api and /health here.   docker compose -f infra/deploy/compose.api.yml up -d --build
name: sinchaislot

services:
  db:
    image: timescale/timescaledb-ha:pg16
    environment: {POSTGRES_USER: sinchai, POSTGRES_PASSWORD: sinchai, POSTGRES_DB: sinchai}
    volumes: [dbdata:/home/postgres/pgdata/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sinchai -d sinchai"]
      interval: 5s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  mqtt:
    image: eclipse-mosquitto:2
    volumes: [../mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro]
    restart: unless-stopped

  api:
    build: {context: ../.., dockerfile: services/Dockerfile}
    image: sinchaislot-py
    # Only Caddy can reach this container, so its forwarded address is trusted.
    command: ["uvicorn", "sinchai_api.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips", "*"]
    environment:
      DATABASE_URL: postgresql+psycopg://sinchai:sinchai@db:5432/sinchai
      REDIS_URL: redis://redis:6379/0
      MQTT_HOST: mqtt
    env_file: [{path: ../../.env, required: false}]
    depends_on:
      db: {condition: service_healthy}
      mqtt: {condition: service_started}
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8000/health"]
      interval: 10s
      retries: 30
      start_period: 300s
    restart: unless-stopped

  drive-sim:
    image: sinchaislot-py
    command: ["python", "-m", "sinchai_devices.sim_server", "--port", "5020", "--profile", "demo", "--speed", "60"]
    depends_on: [api]
    restart: unless-stopped

  edge:
    image: sinchaislot-py
    command: ["python", "-m", "sinchai_edge.run", "--pump", "P2", "--drive", "tcp://drive-sim:5020", "--mqtt", "mqtt:1883"]
    environment: {EDGE_STATE_DIR: /tmp/edge}
    depends_on: [drive-sim, mqtt]
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports: ["80:80", "443:443"]
    environment: {API_HOST: "${API_HOST:-sinchaislot-api.prashantthakur.dev}"}
    volumes: [./Caddyfile:/etc/caddy/Caddyfile:ro, caddydata:/data]
    depends_on: [api]
    restart: unless-stopped

volumes:
  dbdata:
  caddydata:
