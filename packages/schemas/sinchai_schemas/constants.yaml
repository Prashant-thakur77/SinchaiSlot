# SinchaiSlot constants. Single source for every real-world value used by the code.
#
# kind:
#   published  - taken from a cited publication (source URL required)
#   assumption - modelling parameter not found in a publication; reasoning given,
#                covered by the sensitivity sweep in Prayogshala where it matters
#   config     - site configuration (coordinates, sizing) to confirm on the ground

sources:
  india_forum: https://www.theindiaforum.in/public-policy/solar-pumps-are-key-bihars-rural-electrification-strategy
  chakhaji: https://ngobox.org/detail_impax_Chakhaji-Model---Catalyzing-%E2%80%98Buyer-Friendly%E2%80%99-Solar-Irrigation-Service-Markets_164
  iwmi_shg: https://cgspace.cgiar.org/server/api/core/bitstreams/1ad4f8d3-4c1d-42dc-99ea-cdd4ad07a10c/content
  iwmi_holding: https://cgspace.cgiar.org/server/api/core/bitstreams/ca974c06-3a0d-490e-8ee6-fc2fc2cb50e6/content
  aciar: https://research.aciar.gov.au/sdip/wp-content/uploads/2023/03/ElectrifyingAgricultureinBihar_postreview_Final.pdf
  india_ghg: https://indiaghgp.org/sites/default/files/Road%20Transport%20Technical%20Paper.pdf
  ceew: https://www.ceew.in/publications/solar-pumps-underutilization-and-usage-patterns-in-india
  dhundi: https://cdkn.org/wp-content/uploads/2020/06/Dhundi-solar-pumps-case-study-2.pdf
  bihar_subsidy: https://indianmasterminds.com/news/bihar-diesel-subsidy-farmers-irrigation-2026-225902/
  cgwb_2025: https://pib.gov.in/PressReleasePage.aspx?PRID=2220203
  kusum_progress: https://ianslive.in/over-10-lakh-standalone-solar-pumps-installed-13-lakh-grid-connected-pumps-solarised--20260311092345
  kusum_iisd: https://www.iisd.org/system/files/2026-02/beyond-irrigation-solar-pumps-india.pdf
  oorja_solve: https://solve.mit.edu/challenges/2024-global-climate-challenge/solutions/89851?hsLang=en
  oorja_agfund: https://www.arabnews.com/node/2651514/world
  se_impact: https://www.se.com/ww/en/about-us/sustainability/impact-investing
  se_astha: https://blog.se.com/sustainability/2024/10/30/powering-systemic-sustainable-change-with-smart-village-solutions
  altivar_solar: https://www.se.com/za/en/product-range/247470166-altivar-solar
  heftcom: https://arxiv.org/html/2507.01579v2
  fao56: https://www.fao.org/4/x0490e/x0490e00.htm
  fao29: https://www.fao.org/4/t0234e/T0234E01.htm
  fao56_soils: https://www.fao.org/4/x0490e/x0490e0c.htm
  cgwb_recharge_plan: https://cgwb.gov.in/sites/default/files/2022-10/karauli_district_sapotra_block.pdf
  cgwb_master_plan: https://cgwb.gov.in/node/1845
  rbi_kcc_subvention: https://website.rbi.org.in/documents/d/rbi/circularonmissdatedjanuary132026
  kcc_pri: https://hdfcbank.com/agri/gov-schemes/central-interest-subvention-scheme
  bharat_vistaar: https://frontiertech.niti.gov.in/story/how-bharat-vistaar-is-connecting-140m-farmers-to-smarter-agriculture/
  vistaar_launch: https://www.tribuneindia.com/news/india/shivraj-chouhan-launches-ai-powered-bharat-vistaar-platform-for-farmers/
  nasa_power: https://power.larc.nasa.gov/
  open_meteo: https://open-meteo.com/

constants:
  # ---- Prices and costs ----
  diesel_water_rs_per_hour:
    value: 120
    unit: Rs/h
    kind: published
    source: chakhaji
    note: Diesel pump water price in Chakhaji, Samastipur (also India Forum).
  solar_water_rs_per_hour:
    value: 100
    unit: Rs/h
    kind: published
    source: chakhaji
    note: Solar water price charged by Chakhaji solar pump owners.
  oorja_tariff_rs_per_m3_low:
    value: 3
    unit: Rs/m3
    kind: published
    source: oorja_solve
  oorja_tariff_rs_per_m3_high:
    value: 4
    unit: Rs/m3
    kind: published
    source: oorja_solve
  unit_capex_rs:
    value: 600000
    unit: Rs
    kind: published
    source: iwmi_shg
    note: About Rs 6 lakh for a 5 HP / 5 kWp shared solar irrigation unit.
  seller_markup_low:
    value: 1.5
    unit: x diesel cost
    kind: published
    source: india_forum
  seller_markup_high:
    value: 2.5
    unit: x diesel cost
    kind: published
    source: india_forum

  # ---- Diesel and climate ----
  diesel_l_per_hour_5hp:
    value: 1.0
    unit: L/h
    kind: published
    source: aciar
  co2_kg_per_l_diesel:
    value: 2.6444
    unit: kg CO2/L
    kind: published
    source: india_ghg

  # ---- Context statistics ----
  ceew_solar_pump_utilisation:
    value: 0.27
    unit: fraction
    kind: published
    source: ceew
    note: Chhattisgarh owner pumps, remote-monitoring data on 1,131 pumps. Context only, not a Bihar baseline.
  ceew_pumps_transmitting_share:
    value: 0.34
    unit: fraction
    kind: published
    source: ceew
    note: 446 of 1,306 pumps still transmitting, December 2020.
  dhundi_pumping_share:
    value: 0.26
    unit: fraction
    kind: published
    source: dhundi
  bihar_diesel_structures_share:
    value: 0.79
    unit: fraction
    kind: published
    source: iwmi_shg
  bihar_farmers_buying_irrigation:
    value: 0.719
    unit: fraction
    kind: published
    source: india_forum
  bihar_irrigation_market_rs_crore:
    value: 2000
    unit: Rs crore/yr
    kind: published
    source: iwmi_shg
  bihar_avg_holding_ha:
    value: 0.22
    unit: ha
    kind: published
    source: iwmi_holding
  india_gw_extraction_stage:
    value: 0.6063
    unit: fraction
    kind: published
    source: cgwb_2025
  chakhaji_farmers:
    value: 550
    unit: farmers
    kind: published
    source: chakhaji
  kusum_standalone_pumps:
    value: 1000000
    unit: pumps
    kind: published
    source: kusum_progress
    note: More than 10 lakh standalone solar pumps installed by March 2026.

  # ---- Bihar diesel subsidy, Kharif 2026 ----
  bihar_diesel_subsidy_rs_per_l:
    value: 75
    unit: Rs/L
    kind: published
    source: bihar_subsidy
  bihar_diesel_subsidy_rs_per_acre_irrigation:
    value: 750
    unit: Rs/acre/irrigation
    kind: published
    source: bihar_subsidy
  bihar_diesel_subsidy_max_irrigations:
    value: 3
    unit: irrigations
    kind: published
    source: bihar_subsidy
  bihar_diesel_subsidy_max_acres:
    value: 8
    unit: acres
    kind: published
    source: bihar_subsidy

  # ---- Forecast benchmark context ----
  heftcom_winner_pinball:
    value: 22.18
    unit: pinball
    kind: published
    source: heftcom
  heftcom_benchmark_pinball:
    value: 53.58
    unit: pinball
    kind: published
    source: heftcom

  # ---- Site configuration ----
  site_lat:
    value: 25.86
    unit: deg N
    kind: config
    source: nasa_power
    note: Samastipur town, approximate. Confirm the pilot cluster coordinates on the ground.
  site_lon:
    value: 85.78
    unit: deg E
    kind: config
    source: nasa_power
  pump_hp:
    value: 5
    unit: HP
    kind: published
    source: iwmi_shg
  pv_kwp:
    value: 5
    unit: kWp
    kind: published
    source: iwmi_shg
  command_area_acres:
    value: 20
    unit: acres
    kind: published
    source: iwmi_shg

  # ---- Modelling assumptions (see docs/decisions/0003-model-assumptions.md) ----
  pump_rated_kw:
    value: 3.7
    unit: kW
    kind: assumption
    note: Motor shaft rating of a 5 HP pump (5 x 0.746 kW).
  pump_rated_flow_m3h:
    value: 30
    unit: m3/h
    kind: assumption
    note: Chosen so that Rs 100/h solar water equals about Rs 3.3/m3, inside the published Rs 3-4/m3 band.
  pump_rated_head_m:
    value: 20
    unit: m
    kind: assumption
    note: Total dynamic head for shallow Gangetic-plain aquifer plus field delivery losses.
  pump_min_freq_hz:
    value: 30
    unit: Hz
    kind: assumption
    note: Below about 60% speed a centrifugal pump at this head delivers no water.
  diesel_pump_flow_m3h:
    value: 30
    unit: m3/h
    kind: assumption
    note: Same delivery as the solar pump, so one diesel hour equals one solar pump hour at rated flow.
  pv_system_derate:
    value: 0.80
    unit: fraction
    kind: assumption
    note: Wiring, soiling, temperature-independent losses, drive conversion.
  pv_temp_coeff_per_c:
    value: -0.004
    unit: 1/degC
    kind: assumption
    note: Typical crystalline silicon power temperature coefficient.
  mill_kwh_per_kg:
    value: 0.07
    unit: kWh/kg
    kind: assumption
    note: Small stone/plate flour mill (atta chakki). Swept in the sensitivity analysis.
  mill_rated_kw:
    value: 3.7
    unit: kW
    kind: assumption
  mill_rs_per_kg:
    value: 3
    unit: Rs/kg
    kind: assumption
    note: Village grinding charge. Swept in the sensitivity analysis.
  mill_demand_kg_per_day:
    value: 120
    unit: kg/day
    kind: assumption
    note: Swept in the sensitivity analysis.
  chaff_cutter_kw:
    value: 1.5
    unit: kW
    kind: assumption
  chaff_cutter_hours_per_day:
    value: 2
    unit: h/day
    kind: assumption
  chaff_cutter_rs_per_hour:
    value: 40
    unit: Rs/h
    kind: assumption
  battery_pack_kwh:
    value: 1.0
    unit: kWh
    kind: assumption
    note: Swappable lithium pack for lights, phone charging and small loads.
  battery_packs_per_day:
    value: 6
    unit: packs/day
    kind: assumption
  battery_pack_rs_per_charge:
    value: 20
    unit: Rs/charge
    kind: assumption
  saur_mitra_revenue_share:
    value: 0.25
    unit: fraction
    kind: assumption
  platform_revenue_share:
    value: 0.10
    unit: fraction
    kind: assumption
  sinchaislot_tariff_rs_per_m3:
    value: 3.0
    unit: Rs/m3
    kind: assumption
    note: Set at the low end of the published Oorja band and under the diesel price per m3.
  application_efficiency:
    value: 0.65
    unit: fraction
    kind: assumption
    note: Surface (flood/furrow) irrigation application efficiency, FAO typical range 0.6-0.7.
  seasonal_budget_mm:
    value: 450
    unit: mm/yr over command area
    kind: assumption
    note: Annual extraction cap for the cluster. Set from block recharge; confirm against the CGWB block report for the pilot block.
  samastipur_block_category:
    value: Safe
    unit: category
    kind: assumption
    note: UNVERIFIED. Most Samastipur blocks are assessed Safe; confirm the pilot block category from the CGWB dynamic groundwater assessment.
  households_per_pump:
    value: 50
    unit: households
    kind: assumption
    note: Mid-point of the 40-60 households a 20-acre command serves at Bihar holding sizes (PLAN.md 7.1).
  tenant_share:
    value: 0.35
    unit: fraction of households
    kind: assumption
    note: Share of households farming leased or sharecropped land. Confirm in the pilot survey.
  owner_plot_ha:
    value: 0.8
    unit: ha
    kind: assumption
    note: Land of the pump-owning household inside the command area.
  crop_mix_rabi:
    value: {wheat: 0.65, potato: 0.20, fallow: 0.15}
    unit: share of plots
    kind: assumption
  crop_mix_zaid:
    value: {maize: 0.40, veg_summer: 0.25, fallow: 0.35}
    unit: share of plots
    kind: assumption
  crop_mix_kharif:
    value: {paddy: 0.85, fallow: 0.15}
    unit: share of plots
    kind: assumption
  request_window_days:
    value: 3
    unit: days
    kind: assumption
    note: Days a farmer waits for solar water after the crop needs it before buying diesel water.
  oorja_style_tariff_rs_per_m3:
    value: 3.5
    unit: Rs/m3
    kind: assumption
    note: Mid-point of the published Oorja Rs 3-4/m3 band, used for baseline C.
  operator_start_hour:
    value: 7
    unit: h IST
    kind: assumption
  operator_end_hour:
    value: 17
    unit: h IST
    kind: assumption
  om_rs_per_year:
    value: 15000
    unit: Rs/yr
    kind: assumption
    note: Annual operation and maintenance of a 5 kWp shared pump (cleaning, small parts). Confirm with operators.

  # ---- Extras: cluster, health, credit, water quality, recharge, advisory ----
  cluster_pump_offsets_deg:
    value: {P2: [0.0085, 0.0010], P3: [-0.0040, 0.0080]}
    unit: deg (lon, lat) from P1
    kind: config
    note: Neighbouring pumps in the demo cluster (simulated). Replace with surveyed locations.
  transfer_max_channel_m:
    value: 700
    unit: m
    kind: assumption
    note: Longest field-channel or lay-flat pipe run a farmer will accept to take water from a neighbouring pump.
  telemetry_late_after_min:
    value: 10
    unit: min
    kind: assumption
    note: Edge publishes every minute while awake; 10 missed messages marks it late.
  telemetry_silent_after_min:
    value: 60
    unit: min
    kind: assumption
    note: No message for an hour in daylight means the pump has gone silent; the operator is alerted.
  kcc_interest_rate:
    value: 0.07
    unit: per year
    kind: published
    source: rbi_kcc_subvention
    note: Short-term crop loan rate to farmers under the interest subvention scheme (2025-26).
  kcc_prompt_repayment_incentive:
    value: 0.03
    unit: per year
    kind: published
    source: kcc_pri
    note: Extra subvention for prompt repayment, effective rate 4%.
  harvest_credit_share_cap:
    value: 0.5
    unit: fraction of the booking
    kind: assumption
    note: Share of a booking that can be paid after harvest. The rest is paid at booking so the Saur Mitra has cash.
  harvest_credit_limit_rs:
    value: 1500
    unit: Rs per farmer
    kind: assumption
    note: Outstanding after-harvest credit per farmer; raised only by a clean repayment record.
  harvest_credit_fee_rate:
    value: 0.07
    unit: per year, simple
    kind: assumption
    note: Fee priced at the published KCC rate so deferring is never dearer than a crop loan.
  water_ec_none_below_dsm:
    value: 0.7
    unit: dS/m
    kind: published
    source: fao29
    note: Salinity, degree of restriction on use - none below 0.7 dS/m (TDS 450 mg/l).
  water_ec_severe_above_dsm:
    value: 3.0
    unit: dS/m
    kind: published
    source: fao29
    note: Salinity - severe restriction above 3.0 dS/m (TDS 2000 mg/l); slight to moderate between.
  tds_mg_per_l_per_dsm:
    value: 640
    unit: mg/l per dS/m
    kind: published
    source: fao29
    note: Conversion used in the FAO guideline tables for EC below 5 dS/m.
  recharge_shaft_m3_per_year:
    value: 35000
    unit: m3/yr
    kind: published
    source: cgwb_recharge_plan
    note: CGWB block plan planning norm (0.035 MCM per shaft), Rajasthan; depends on surplus runoff. Not a Bihar figure.
  recharge_shaft_cost_rs:
    value: 500000
    unit: Rs
    kind: published
    source: cgwb_recharge_plan
    note: CGWB block plan unit cost per recharge shaft (alluvium about Rs 5 lakh).
  farm_pond_m3:
    value: 1200
    unit: m3 storage
    kind: assumption
    note: A 30 x 20 x 2 m farm pond; recharge counted as seepage of one fill plus refills per monsoon.
  farm_pond_fills_per_monsoon:
    value: 3
    unit: fills
    kind: assumption
  farm_pond_seepage_share:
    value: 0.5
    unit: fraction of stored water reaching groundwater
    kind: assumption
  farm_pond_cost_rs:
    value: 120000
    unit: Rs
    kind: assumption
    note: Earthwork for 1,200 m3 at about Rs 100/m3. Confirm with MGNREGA estimates.
  vistaar_helpline:
    value: "155261"
    unit: phone
    kind: published
    source: vistaar_launch
    note: Bharat-VISTAAR toll-free advisory line, launched 17 Feb 2026 (Hindi and English first).

  crop_ecw_threshold_dsm:
    value: {wheat: 4.0, paddy: 2.0, maize: 1.1, potato: 1.1, veg_summer: 1.0}
    unit: dS/m irrigation water EC at 100% yield potential
    kind: published
    source: fao29
    note: FAO-29 crop salt tolerance table (100% yield potential). veg_summer uses the lowest common vegetable value.
